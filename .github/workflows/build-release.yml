name: Build Windows & macOS Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyinstaller

      - name: Download & Copy FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path player_ui\bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
          $binDir = (Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffmpeg.exe").DirectoryName
          Copy-Item "$binDir\ffmpeg.exe" -Destination "player_ui\bin\ffmpeg.exe"
          Copy-Item "$binDir\ffprobe.exe" -Destination "player_ui\bin\ffprobe.exe"

      - name: Bundle Windows EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name "Huq" `
            --collect-data sofar `
            --collect-data pyfar `
            --add-binary "hrtf_core\target\release\hrtf_core.dll;." `
            --add-binary "player_ui\bin\ffmpeg.exe;bin" `
            --add-binary "player_ui\bin\ffprobe.exe;bin" `
            --add-data "player_ui\default.sofa;." `
            player_ui\main.py
          Compress-Archive -Path "dist\Huq\*" -DestinationPath "Huq-Windows.zip" -Force

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Huq ${{ github.ref_name }}
          files: Huq-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyinstaller

      - name: Install & Copy FFmpeg (ARM64)
        run: |
          brew install ffmpeg
          mkdir -p player_ui/bin
          cp "$(which ffmpeg)" player_ui/bin/ffmpeg
          cp "$(which ffprobe)" player_ui/bin/ffprobe
          chmod +x player_ui/bin/ffmpeg player_ui/bin/ffprobe

      - name: Bundle macOS .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "Huq" \
            --osx-bundle-identifier "com.restlessotaku.huq" \
            --collect-data sofar \
            --collect-data pyfar \
            --add-binary "hrtf_core/target/release/libhrtf_core.dylib:." \
            --add-binary "player_ui/bin/ffmpeg:bin" \
            --add-binary "player_ui/bin/ffprobe:bin" \
            --add-data "player_ui/default.sofa:." \
            player_ui/main.py

      - name: Ad-Hoc Code Sign .app & Create .dmg
        run: |
          find "dist/Huq.app" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --sign - "dist/Huq.app/Contents/Frameworks/Python.framework/Versions/3.12/Python" || true
          codesign --deep --force --sign - "dist/Huq.app"
          mkdir -p dmg_stage
          cp -R "dist/Huq.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Huq" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            "Huq-macOS-AppleSilicon.dmg"

      - name: Upload macOS .dmg Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Huq ${{ github.ref_name }}
          files: Huq-macOS-AppleSilicon.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & Gradle
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Install Rust & cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android Native DSP (.so)
        run: |
          cargo install cargo-ndk
          cd android_core
          cargo ndk -t arm64-v8a -o ../android_app/app/src/main/jniLibs build --release

      - name: Build Android APK
        working-directory: android_app
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Huq-Android.apk

      - name: Upload Android APK Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Huq ${{ github.ref_name }}
          files: Huq-Android.apk
