name: Build Windows & macOS Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyinstaller

      - name: Download & Copy FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path player_ui\bin | Out-Null
          curl.exe -fSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          python -c "import os, zipfile, shutil; zipfile.ZipFile('ffmpeg.zip').extractall('ffmpeg_tmp'); [shutil.copy(os.path.join(r, fn), os.path.join('player_ui/bin', fn)) for r, _, fs in os.walk('ffmpeg_tmp') for fn in fs if fn in ('ffmpeg.exe', 'ffprobe.exe')]"

      - name: Bundle Windows EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name "Huq" `
            --collect-data sofar `
            --collect-data pyfar `
            --add-binary "hrtf_core\target\release\hrtf_core.dll;." `
            --add-binary "player_ui\bin\ffmpeg.exe;bin" `
            --add-binary "player_ui\bin\ffprobe.exe;bin" `
            --add-data "player_ui\default.sofa;." `
            player_ui\main.py
          Compress-Archive -Path "dist\Huq\*" -DestinationPath "Huq-Windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huq-Windows
          path: Huq-Windows.zip

      - name: Upload Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Huq ${{ github.ref_name }}
          files: Huq-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyqt-liquidglass pyinstaller

      - name: Install & Copy FFmpeg (ARM64)
        run: |
          brew install ffmpeg
          mkdir -p player_ui/bin
          cp "$(which ffmpeg)" player_ui/bin/ffmpeg
          cp "$(which ffprobe)" player_ui/bin/ffprobe
          chmod +x player_ui/bin/ffmpeg player_ui/bin/ffprobe

      - name: Build macOS Driver-Free Process Tap Helper
        run: |
          clang -dynamiclib -fobjc-arc -O2 -framework Foundation -framework CoreAudio \
            macos_tap/huq_tap.m -o macos_tap/libhuq_tap.dylib

      - name: Bundle macOS .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "Huq" \
            --osx-bundle-identifier "com.restlessotaku.huq" \
            --collect-data sofar \
            --collect-data pyfar \
            --add-binary "hrtf_core/target/release/libhrtf_core.dylib:." \
            --add-binary "macos_tap/libhuq_tap.dylib:." \
            --add-binary "player_ui/bin/ffmpeg:bin" \
            --add-binary "player_ui/bin/ffprobe:bin" \
            --add-data "player_ui/default.sofa:." \
            player_ui/main.py
          /usr/libexec/PlistBuddy -c "Add :NSAudioCaptureUsageDescription string 'Huq captures system audio to apply real-time binaural HRTF processing.'" "dist/Huq.app/Contents/Info.plist" 

      - name: Ad-Hoc Code Sign .app & Create .dmg
        run: |
          find "dist/Huq.app" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --sign - "dist/Huq.app/Contents/Frameworks/Python.framework/Versions/3.12/Python" || true
          codesign --deep --force --sign - "dist/Huq.app"
          mkdir -p dmg_stage
          cp -R "dist/Huq.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Huq" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            "Huq-macOS-AppleSilicon.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huq-macOS-AppleSilicon
          path: Huq-macOS-AppleSilicon.dmg

      - name: Upload macOS .dmg Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Huq ${{ github.ref_name }}
          files: Huq-macOS-AppleSilicon.dmg

