name: Build Windows & macOS Releases

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyinstaller

      - name: Install FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Copy FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path player_ui\bin | Out-Null
          Copy-Item (Get-Command ffmpeg.exe).Source -Destination "player_ui\bin\ffmpeg.exe"
          Copy-Item (Get-Command ffprobe.exe).Source -Destination "player_ui\bin\ffprobe.exe"

      - name: Bundle Windows EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name "HRTF_Spatial_Player" `
            --collect-data sofar `
            --collect-data pyfar `
            --add-binary "hrtf_core\target\release\hrtf_core.dll;." `
            --add-binary "player_ui\bin\ffmpeg.exe;bin" `
            --add-binary "player_ui\bin\ffprobe.exe;bin" `
            --add-data "player_ui\default.sofa;." `
            player_ui\main.py
          Compress-Archive -Path "dist\HRTF_Spatial_Player\*" -DestinationPath "HRTF_Spatial_Player-Windows.zip" -Force

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HRTF Spatial Player (Latest)
          files: HRTF_Spatial_Player-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust DSP library
        working-directory: hrtf_core
        run: cargo build --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sounddevice soundfile pyfar pyqtgraph mutagen PySide6 pyinstaller

      - name: Install & Copy FFmpeg (ARM64)
        run: |
          brew install ffmpeg
          mkdir -p player_ui/bin
          cp "$(which ffmpeg)" player_ui/bin/ffmpeg
          cp "$(which ffprobe)" player_ui/bin/ffprobe
          chmod +x player_ui/bin/ffmpeg player_ui/bin/ffprobe

      - name: Bundle macOS .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "HRTF Spatial Player" \
            --osx-bundle-identifier "com.restlessotaku.hrtfplayer" \
            --collect-data sofar \
            --collect-data pyfar \
            --add-binary "hrtf_core/target/release/libhrtf_core.dylib:." \
            --add-binary "player_ui/bin/ffmpeg:bin" \
            --add-binary "player_ui/bin/ffprobe:bin" \
            --add-data "player_ui/default.sofa:." \
            player_ui/main.py

      - name: Ad-Hoc Code Sign .app & Create .dmg
        run: |
          codesign --deep --force --options runtime --sign - "dist/HRTF Spatial Player.app"
          mkdir -p dmg_stage
          cp -R "dist/HRTF Spatial Player.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "HRTF Spatial Player" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            "HRTF_Spatial_Player-macOS-AppleSilicon.dmg"

      - name: Upload macOS .dmg Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HRTF Spatial Player (Latest)
          files: HRTF_Spatial_Player-macOS-AppleSilicon.dmg
